# Build: Vite → dist. projectId + authDomain alineados con el proyecto Firebase (evita auth/unauthorized-domain por env mezclado).
# La API key sigue debiendo definirse en Netlify: Site settings → Environment variables → VITE_FIREBASE_API_KEY (no commitear).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_FIREBASE_AUTH_DOMAIN = "mallorca-yacht.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID = "mallorca-yacht"
  VITE_FIREBASE_STORAGE_BUCKET = "mallorca-yacht.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "299417928498"
  VITE_FIREBASE_APP_ID = "1:299417928498:web:042db0523961929c124d2b"
  # Obligatorio en Netlify UI (no commitear): VITE_FIREBASE_API_KEY = la de Firebase Console → Web app

# Cache (Netlify aplica todas las coincidencias; para el mismo header suele prevalecer la regla más concreta / la definida después).
# Orden: primero el comodín SPA; después reglas más específicas que lo refinan.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/site-media.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.woff"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# SPA: rutas profundas (p. ej. /dejar-resena?t=…) sirven index.html para que el cliente enrute.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
